name: Bug report
description: Report reproducible incorrect TaiChiOS behavior
title: "bug: "
labels: ["type: bug", "state: needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not disclose security vulnerabilities here; use the private process in SECURITY.md.
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Include the expected and actual outcome.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence, Profile and relevant mode.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Hardware/VM, Debian snapshot, Node.js, Cordis, DSH and interface versions when relevant.

