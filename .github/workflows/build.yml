name: Build

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pinned Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Install network-isolation helper
        timeout-minutes: 10
        run: >-
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20
          -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true update &&
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20
          -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true
          install --yes bubblewrap
      - name: Install pinned Harness runtime
        run: yarn install:runtime
      - name: Boot compatibility smoke
        run: yarn compat:runtime
      - name: Verify inherited Cordis boundary
        run: yarn compat:cordis

  live-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Setup pinned Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Verify Debian Live definition
        run: yarn compat:live
      - name: Install image and VM tooling
        timeout-minutes: 15
        run: >-
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20
          -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true update &&
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20
          -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true install --yes
          curl debootstrap debian-archive-keyring squashfs-tools xorriso isolinux syslinux-common
          grub-pc-bin grub-efi-amd64-bin mtools dosfstools qemu-system-x86 ovmf netcat-openbsd
      - name: Install pinned live-build
        run: yarn install:live-build
      - name: Install pinned Harness runtime
        run: yarn install:runtime
      - name: Build hybrid image
        run: yarn build:live
      - name: Boot without networking under BIOS and UEFI
        run: yarn test:live
      - name: Install and boot from disk under BIOS and UEFI
        run: yarn test:install
      - name: Preserve the tested main-branch image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: taichios-0.1-main-${{ github.sha }}
          path: artifacts/live/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn --no-immutable
      - name: Lint
        run: yarn lint

  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn --no-immutable
      - name: Build (1)
        run: yarn build core
      - name: Build (2)
        run: yarn build
      - name: Publish
        if: >-
          github.event_name == 'push' &&
          contains(fromJson('["refs/heads/main"]'), github.ref)
        run: |-
          yarn config set npmPublishProvenance true
          yarn config set npmRegistryServer https://registry.npmjs.org/
          yarn yakumo publish

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn --no-immutable
      - name: Build workspace dependencies
        run: yarn build
      - name: Unit Test
        run: yarn test:json
