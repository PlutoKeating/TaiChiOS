set default=1
set timeout=10

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

menuentry "Install TaiChiOS 0.1 (ERASE DISK)" --hotkey=i {
	linux /live/vmlinuz-6.12.94+deb13-amd64 boot=live components hostname=taichios username=taichi locales=zh_CN.UTF-8,en_US.UTF-8 keyboard-layouts=us console=ttyS0,115200n8 console=tty0 taichios.install=/dev/vda
	initrd /live/initrd.img-6.12.94+deb13-amd64
}
